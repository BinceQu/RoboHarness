[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-codex-mcp"
version = "0.2.1"
description = "A recordable MCP adapter for the BEHAVIOR v2 REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20,<5",
  "mcp>=2.0,<3"
]

[project.scripts]
embodied-codex-mcp = "embodied_codex.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embodied_codex = ["py.typed"]
